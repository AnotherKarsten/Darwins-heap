<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darwin's Heap – Last Process Standing</title>
  <meta name="description" content="Write tiny programs that copy, multiply and attack each other inside a simulated memory. The last program standing wins.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="8" height="8" rx="2" class="c1"/><rect x="12" y="2" width="8" height="8" rx="2" class="c0"/><rect x="22" y="2" width="8" height="8" rx="2" class="c2"/>
        <rect x="2" y="12" width="8" height="8" rx="2" class="c0"/><rect x="12" y="12" width="8" height="8" rx="2" class="c3"/><rect x="22" y="12" width="8" height="8" rx="2" class="c0"/>
        <rect x="2" y="22" width="8" height="8" rx="2" class="c2"/><rect x="12" y="22" width="8" height="8" rx="2" class="c0"/><rect x="22" y="22" width="8" height="8" rx="2" class="c1"/>
      </svg>
      <div>
        <h1>Darwin's <span>Heap</span></h1>
        <div class="tagline">Last Process Standing</div>
      </div>
    </div>
    <nav class="topnav">
      <button class="btn ghost" id="btn-tutorial" data-i18n="nav.tutorial" data-i18n-title="nav.tutorial.title">🎓 Tutorial</button>
      <button class="btn ghost" id="btn-manual" data-i18n="nav.manual" data-i18n-title="nav.manual.title">📖 Manual</button>
      <button class="btn ghost" id="btn-tournament" data-i18n="nav.tournament" data-i18n-title="nav.tournament.title">🏆 Tournament</button>
      <button class="btn ghost" id="btn-share" data-i18n="nav.share" data-i18n-title="nav.share.title">🔗 Share</button>
      <div class="lang-switch" role="group" data-i18n-aria="nav.lang" aria-label="Language">
        <button class="lang-btn" data-lang="en" title="English">EN</button>
        <button class="lang-btn" data-lang="de" title="Deutsch">DE</button>
      </div>
      <button class="btn ghost icon" id="btn-settings" data-i18n-title="nav.settings" data-i18n-aria="nav.settings" title="Settings" aria-label="Settings">⚙️</button>
    </nav>
  </header>

  <main class="layout">
    <!-- left column: programs -->
    <aside class="panel left" data-i18n-aria="aria.programs" aria-label="Programs">
      <div class="panel-head">
        <h2 data-i18n="panel.programs">Programs</h2>
        <span class="muted" id="slot-count"></span>
      </div>
      <div id="slots" class="slots"></div>
      <button class="btn dashed" id="add-slot" data-i18n="slots.add">＋ Add program</button>
      <div class="quickstart">
        <div class="muted small" data-i18n="quick.title">Quick start</div>
        <div class="row wrap">
          <button class="chip" data-preset="solo" data-i18n="quick.solo">Me vs. bot</button>
          <button class="chip" data-preset="royale" data-i18n="quick.royale">4-way battle royale</button>
          <button class="chip" data-preset="bots" data-i18n="quick.bots">Watch bots only</button>
        </div>
      </div>
    </aside>

    <!-- centre: arena -->
    <section class="stage" data-i18n-aria="aria.stage" aria-label="Arena">
      <div id="goal-banner" class="goal-banner" hidden>
        <span class="goal-icon">🎯</span>
        <div class="goal-text"><b id="goal-title"></b><span id="goal-desc"></span></div>
        <button class="btn small" id="goal-lesson" data-i18n="goal.lesson">Lesson</button>
        <button class="btn small ghost" id="goal-close" data-i18n-title="goal.close" title="Leave lesson">✕</button>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="arena-canvas" data-i18n-aria="aria.arena" aria-label="Memory arena"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
        <div id="stage-overlay" class="stage-overlay">
          <div class="overlay-card">
            <div class="overlay-title" data-i18n="overlay.ready">Ready to fight</div>
            <div class="overlay-sub" id="overlay-sub" data-i18n="overlay.hint">Press ▶ or the space bar</div>
            <button class="btn primary big" id="overlay-play" data-i18n="overlay.start">▶ Start</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="ctrl-group">
          <button class="btn icon" id="btn-reset" data-i18n-title="ctrl.reset" title="Restart with new positions (R)" aria-label="Restart">⟲</button>
          <button class="btn primary icon wide" id="btn-play" data-i18n-title="ctrl.play" title="Start/pause (space)" aria-label="Start/pause">▶</button>
          <button class="btn icon" id="btn-step" data-i18n-title="ctrl.step" title="Advance one cycle (→). With Shift: a single instruction" aria-label="Step">⏭</button>
        </div>
        <div class="ctrl-group speed">
          <span class="muted small">🐢</span>
          <input type="range" id="speed" min="0" max="16" step="1" data-i18n-aria="ctrl.speed" aria-label="Speed">
          <span class="muted small">🐇</span>
          <span id="speed-label" class="speed-label"></span>
        </div>
        <div class="ctrl-group seg" role="radiogroup" data-i18n-aria="ctrl.view" aria-label="View">
          <button class="seg-btn active" data-view="owner" data-i18n="view.owner" data-i18n-title="view.owner.title">Ownership</button>
          <button class="seg-btn" data-view="writes" data-i18n="view.writes" data-i18n-title="view.writes.title">Write heat</button>
          <button class="seg-btn" data-view="execs" data-i18n="view.execs" data-i18n-title="view.execs.title">Execution</button>
        </div>
      </div>
      <div class="cycle-row">
        <span class="muted small"><span data-i18n="cycle">Cycle</span> <b id="cycle-now">0</b> / <span id="cycle-max">0</span></span>
        <div class="progress"><div id="cycle-bar"></div></div>
        <span class="muted small" id="seed-label"></span>
        <button class="btn small ghost" id="btn-legend" data-i18n="leg.toggle" aria-expanded="true">Legend</button>
      </div>
      <div class="legend" id="legend" aria-live="polite"></div>
    </section>

    <!-- right column: statistics -->
    <aside class="panel right" data-i18n-aria="aria.stats" aria-label="Statistics">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="live" role="tab" data-i18n="tab.live">Live</button>
        <button class="tab" data-tab="lens" role="tab" data-i18n="tab.lens">Lens</button>
        <button class="tab" data-tab="analysis" role="tab" data-i18n="tab.analysis">Analysis</button>
      </div>
      <div class="tab-body" data-body="live">
        <div id="player-cards" class="player-cards"></div>
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart.procs">Processes</div>
          <canvas id="chart-procs" class="chart"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-title" data-i18n="chart.cells">Memory share</div>
          <canvas id="chart-cells" class="chart"></canvas>
        </div>
        <div class="chart-title" data-i18n="events">Events</div>
        <ol id="event-log" class="event-log"></ol>
      </div>
      <div class="tab-body" data-body="lens" hidden>
        <div class="row lens-head">
          <label class="small muted"><span data-i18n="lens.addr">Address</span> <input type="number" id="lens-addr" min="0" value="0"></label>
          <label class="small muted"><span data-i18n="lens.follow">Follow</span>
            <select id="lens-follow"><option value="-1">–</option></select>
          </label>
        </div>
        <div id="lens-info" class="lens-info"></div>
        <ol id="lens-list" class="lens-list"></ol>
        <p class="muted small" data-i18n="lens.tip"></p>
      </div>
      <div class="tab-body" data-body="analysis" hidden>
        <div id="analysis"></div>
      </div>
    </aside>
  </main>

  <!-- editor -->
  <dialog id="editor-dialog" class="dialog wide">
    <form method="dialog" class="dialog-inner editor-layout" id="editor-form">
      <div class="dialog-head">
        <span class="color-dot" id="editor-dot"></span>
        <input id="editor-name" class="title-input" maxlength="32" data-i18n-placeholder="ed.name" data-i18n-aria="ed.name">
        <div class="row">
          <select id="editor-template" aria-label="Template"></select>
          <button type="button" class="btn small ghost" id="editor-open" data-i18n-title="ed.open">📂</button>
          <button type="button" class="btn small ghost" id="editor-save" data-i18n-title="ed.save">💾</button>
          <input type="file" id="editor-file" accept=".heap,.red,.txt" hidden>
          <button type="button" class="btn small ghost" data-max data-i18n-title="dlg.max" title="Maximise">⤢</button>
        </div>
      </div>
      <div class="editor-main">
        <div class="code-editor" id="code-editor"></div>
        <div class="editor-side">
          <div id="editor-status" class="editor-status"></div>
          <ul id="editor-errors" class="editor-errors"></ul>
          <div class="chart-title">💡 <span data-i18n="ed.help">Help at the cursor</span></div>
          <div id="editor-help" class="editor-help" aria-live="polite"></div>
          <div class="chart-title"><span data-i18n="ed.reference">Reference</span> <span class="muted small" data-i18n="ed.clickInsert"></span></div>
          <div id="editor-ref" class="editor-ref"></div>
        </div>
      </div>
      <div class="dialog-foot">
        <span class="muted small" data-i18n="ed.foot"></span>
        <div class="row">
          <button type="button" class="btn ghost" id="editor-cancel" data-i18n="ed.cancel">Cancel</button>
          <button type="button" class="btn primary" id="editor-apply" data-i18n="ed.apply">Apply</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- tutorial -->
  <dialog id="tutorial-dialog" class="dialog wide">
    <div class="dialog-inner tutorial-layout">
      <div class="dialog-head">
        <h2 data-i18n="tut.title">🎓 Tutorial</h2>
        <div class="row"><button type="button" class="btn small ghost" data-max data-i18n-title="dlg.max" title="Maximise">⤢</button><button class="btn small ghost" data-close>✕</button></div>
      </div>
      <div class="tutorial-main">
        <ol id="lesson-list" class="lesson-list"></ol>
        <article id="lesson-body" class="lesson-body"></article>
      </div>
    </div>
  </dialog>

  <!-- manual -->
  <dialog id="manual-dialog" class="dialog wide">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 data-i18n="man.title">📖 Manual: Heapcode</h2>
        <div class="row"><button type="button" class="btn small ghost" data-max data-i18n-title="dlg.max" title="Maximise">⤢</button><button class="btn small ghost" data-close>✕</button></div>
      </div>
      <div id="manual-body" class="manual-body"></div>
    </div>
  </dialog>

  <!-- result -->
  <dialog id="result-dialog" class="dialog">
    <div class="dialog-inner">
      <div id="result-body"></div>
      <div class="dialog-foot">
        <button class="btn ghost" data-close data-i18n="res.view">View arena</button>
        <button class="btn primary" id="result-again" data-i18n="res.again">⟲ Rematch (new positions)</button>
      </div>
    </div>
  </dialog>

  <!-- tournament -->
  <dialog id="tournament-dialog" class="dialog wide">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 data-i18n="tour.title">🏆 Tournament</h2>
        <div class="row"><button type="button" class="btn small ghost" data-max data-i18n-title="dlg.max" title="Maximise">⤢</button><button class="btn small ghost" data-close>✕</button></div>
      </div>
      <p class="muted" data-i18n="tour.intro"></p>
      <div class="row wrap">
        <label><span data-i18n="tour.mode">Mode</span>
          <select id="tour-mode">
            <option value="ffa" data-i18n="tour.ffa">Free-for-all</option>
            <option value="pairs" data-i18n="tour.pairs">Round robin (1 vs 1)</option>
          </select>
        </label>
        <label><span data-i18n="tour.rounds">Rounds</span>
          <select id="tour-rounds"><option>10</option><option selected>50</option><option>100</option><option>250</option></select>
        </label>
        <button class="btn primary" id="tour-start" data-i18n="tour.start">Start</button>
      </div>
      <div class="progress tour-progress"><div id="tour-bar"></div></div>
      <div id="tour-result"></div>
    </div>
  </dialog>

  <!-- settings -->
  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" class="dialog-inner settings-form">
      <div class="dialog-head">
        <h2 data-i18n="set.title">⚙️ Settings</h2>
      </div>
      <label><span data-i18n="set.core">Memory size</span>
        <select id="set-core">
          <option value="2000" data-i18n="set.core2000"></option>
          <option value="4000" data-i18n="set.core4000"></option>
          <option value="8000" data-i18n="set.core8000"></option>
        </select>
      </label>
      <label><span data-i18n="set.cycles">Cycle limit</span>
        <select id="set-cycles">
          <option value="0" data-i18n="set.cyclesAuto"></option>
          <option value="10000">10k</option>
          <option value="40000">40k</option>
          <option value="160000">160k</option>
        </select>
      </label>
      <label><span data-i18n="set.procs">Max processes per program</span>
        <select id="set-procs">
          <option value="64">64</option>
          <option value="256">256</option>
          <option value="1000">1000</option>
          <option value="4000">4000</option>
        </select>
      </label>
      <label><span data-i18n="set.seedMode">Start positions</span>
        <select id="set-seed-mode">
          <option value="random" data-i18n="set.random"></option>
          <option value="fixed" data-i18n="set.fixed"></option>
        </select>
      </label>
      <label id="set-seed-wrap"><span data-i18n="set.seed">Seed</span> <input type="number" id="set-seed" min="1" max="4294967295"></label>
      <label class="check"><input type="checkbox" id="set-grid" checked> <span data-i18n="set.grid">Show cell grid</span></label>
      <label class="check"><input type="checkbox" id="set-heads" checked> <span data-i18n="set.heads">Highlight processes</span></label>
      <div class="dialog-foot">
        <button class="btn ghost" value="cancel" data-i18n="set.cancel">Cancel</button>
        <button class="btn primary" id="settings-apply" value="ok" data-i18n="set.apply">Apply</button>
      </div>
    </form>
  </dialog>

  <!-- welcome -->
  <dialog id="welcome-dialog" class="dialog">
    <div class="dialog-inner welcome">
      <div class="lang-switch welcome-lang" role="group" data-i18n-aria="nav.lang">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="de">DE</button>
      </div>
      <h2 data-i18n-html="wel.title"></h2>
      <p data-i18n-html="wel.p1"></p>
      <p class="muted" data-i18n-html="wel.p2"></p>
      <div class="welcome-choices">
        <button class="choice" data-welcome="tutorial"><span>🎓</span><b data-i18n="wel.tutorial"></b><small data-i18n="wel.tutorialText"></small></button>
        <button class="choice" data-welcome="demo"><span>🍿</span><b data-i18n="wel.demo"></b><small data-i18n="wel.demoText"></small></button>
        <button class="choice" data-welcome="solo"><span>⚔️</span><b data-i18n="wel.solo"></b><small data-i18n="wel.soloText"></small></button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
